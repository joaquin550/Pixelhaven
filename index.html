<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pixel Haven</title>
    <meta name="description" content="A 2.5D idle life simulator. Pixel villagers build and live on a voxel island while you watch over them." />

    <!--
      viewport-fit=cover lets the canvas run under the rounded corners, and
      user-scalable=no stops a two-finger pinch from zooming the page instead
      of the world.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Home Screen / standalone behaviour on iPadOS and iOS. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixel Haven" />
    <meta name="theme-color" content="#1d2b3a" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <style>
      /* Inlined so the first paint is never a white flash. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10161f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #bfae9a;
        font: 15px/1.5 ui-rounded, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="app"></div>
    <div id="boot">growing an island…</div>

    <noscript>
      <p style="color: #f4ece0; font-family: system-ui; padding: 24px">
        Pixel Haven needs JavaScript to run.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
    <script>
      // The module removes this once it has mounted; if it never does, the
      // message stays up rather than leaving a blank screen.
      window.addEventListener('pixelhaven:ready', function () {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      });
    </script>
  </body>
</html>
