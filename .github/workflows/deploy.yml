# Publishes the built game to GitHub Pages.
#
# Enable it once under Settings -> Pages -> Source: GitHub Actions. The build
# uses relative asset paths, so it works at any sub-path without configuration.
name: Deploy

on:
  push:
    # The feature branch is here so the game gets a URL before anything is
    # merged. Drop it once this lands on main.
    branches: [main, 'claude/pixel-haven-ipad-5hs6v7']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Pages has to be switched on for the repository first, under
      # Settings -> Pages -> Source: GitHub Actions. The workflow token is not
      # allowed to do that for you, and on a private repository Pages needs a
      # paid plan - see the README for the alternatives.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
